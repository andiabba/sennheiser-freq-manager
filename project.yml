name: SennheiserFreqManager
options:
  bundleIdPrefix: com.andiabba
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

targets:
  SennheiserFreqManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/SennheiserFreqManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andiabba.sennheiser-freq-manager
        PRODUCT_NAME: Sennheiser Freq Manager
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sennheiser Freq Manager needs local network access to discover and control Sennheiser wireless transmitters."
        INFOPLIST_KEY_NSBonjourServices: "_sennheiser._udp.;_ewg4._udp."
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
